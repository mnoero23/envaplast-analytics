[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "envaplast-analytics"
version = "0.1.0"
description = "MVP de business intelligence con datos industriales argentinos sintéticos"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.42,<2",
  "sqlalchemy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "python-dotenv>=1.0,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/app.py" = ["E402"]
