[theme]
base = "light"
primaryColor = "#1B4965"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FA"
textColor = "#202B33"
font = "sans serif"
borderColor = "#DFE6EB"
dataframeBorderColor = "#DFE6EB"
dataframeHeaderBackgroundColor = "#F6F8FA"
chartCategoricalColors = ["#1B4965", "#2A9D8F", "#D9A441", "#D86C4F", "#71808C"]
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 15
headingFontSizes = ["2rem", "1.45rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
linkUnderline = false
blueColor = "#1B4965"
greenColor = "#2A9D8F"
yellowColor = "#E9C46A"
orangeColor = "#D97745"
redColor = "#C94F3D"
grayColor = "#6C757D"

[theme.sidebar]
backgroundColor = "#F7F9FA"
secondaryBackgroundColor = "#EEF2F4"
textColor = "#243746"
primaryColor = "#1B4965"
borderColor = "#E2E8EC"

[server]
headless = true
